<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HyperGo</title><meta name="theme-color" content="#ffffff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="HyperGo"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-192.png"><link rel="stylesheet" href="style.css?v=RESPONSIVE_CLEAN_1"></head><body>
<header><div class="brand">Hyper<span>Go</span></div><div class="search"><input id="searchInput" placeholder="Ürün ara... örn. R25 far"><button id="searchBtn">Ara</button></div><button class="menu" onclick="toggleNav()">☰</button></header>
<nav id="nav"><a href="#sonuclar">Sonuçlar</a><button onclick="seller()">+ Ürününü Öne Çıkar</button></nav>
<main>
<section class="hero"><div id="installPrompt" class="install-prompt" hidden><div class="install-copy"><strong>HyperGo’yu telefona ekle</strong><span>Her aramaya tek dokunuşla ulaş.</span></div><button id="installBtn" type="button">Ana ekrana ekle</button><button id="installClose" class="install-close" type="button" aria-label="Kapat">×</button></div><small>HYPERGO • ÜRÜN ARAMA PLATFORMU</small><h1>Aradığını bul.<br><b>En uygun seçeneğe ulaş.</b></h1><p>Farklı mağazalardaki ürünleri tek yerde karşılaştır.</p><div class="chips"><button onclick="quick('R25 egzoz')">R25 egzoz</button><button onclick="quick('MT25 ön lastik')">MT25 ön lastik</button><button onclick="quick('Clio 4 far')">Clio 4 far</button></div></section>
<section id="sonuclar" class="results"><div class="head"><div><small>SONUÇLAR</small><h2 id="resultTitle">Arama yap</h2><span id="count"></span></div><select id="sort"><option value="relevance">Önerilen</option><option value="cheap">En ucuz</option><option value="expensive">En pahalı</option><option value="title">Ada göre</option></select></div>
<div class="layout"><aside class="filters"><h3>Filtrele</h3><label>Min. fiyat<input id="min" type="number" min="0" placeholder="0"></label><label>Max. fiyat<input id="max" type="number" min="0" placeholder="Sınır yok"></label><label>Mağaza<input id="store" placeholder="Mağaza adı"></label><button onclick="applyFilters()">Filtrele</button><button class="clear" onclick="clearFilters()">Temizle</button></aside><div id="cards" class="cards"><div class="empty">Bir ürün arat.</div></div></div></section></main>
<script src="app.js?v=RESPONSIVE_CLEAN_1"></script></body></html>
